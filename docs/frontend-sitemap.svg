<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <style>
      .bg{fill:#fbfaf7}
      .title{font:800 34px Arial,Helvetica,sans-serif;letter-spacing:2px;fill:#111}
      .subtitle{font:800 18px Arial,Helvetica,sans-serif;letter-spacing:3px;fill:#111}
      .caption{font:400 14px Arial,Helvetica,sans-serif;fill:#555}
      .legend{font:700 12px Arial,Helvetica,sans-serif;letter-spacing:1.3px;fill:#444}
      .page{fill:#111}
      .pageText{font:800 13px Arial,Helvetica,sans-serif;fill:white}
      .root{fill:#25a8df}
      .rootText{font:800 14px Arial,Helvetica,sans-serif;fill:white}
      .node{fill:white;stroke:#111;stroke-width:1.2}
      .nodeText{font:700 12px Arial,Helvetica,sans-serif;fill:#111}
      .component{fill:#d7ad32}
      .componentText{font:800 13px Arial,Helvetica,sans-serif;fill:#111}
      .api{fill:#eef6fb;stroke:#1987b8;stroke-width:1.2}
      .apiText{font:700 12px Arial,Helvetica,sans-serif;fill:#11455d}
      .line{stroke:#d2a729;stroke-width:4;fill:none;stroke-linecap:square}
      .thin{stroke:#d2a729;stroke-width:3;fill:none;stroke-linecap:square}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1050"/>

  <text x="900" y="55" text-anchor="middle" class="title">◆ YUMMY DIARY</text>
  <text x="900" y="110" text-anchor="middle" class="subtitle">FRONTEND WEBSITE SITEMAP</text>

